<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <h3>경매장 - 환산 아이템메이커 보관함(가칭)</h3>

    <div class="tab-container">
        <button class="tab-btn active" id="tabWishlist">경매장 찜 목록</button>
        <button class="tab-btn" id="tabStorage">환산 메이커 보관함</button>
    </div>

    <!--찜 목록-->
    <div id="wishlistContent" class="tab-content active">
        <div class="header-action">
            <div>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 13px;">
                    <input type="checkbox" id="selectAll" class="ui-checkbox">
                    <span class="ui-checkbox-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8" fill="none">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M9.35584 0.620788C9.53461 0.794625 9.5491 1.09213 9.38821 1.28528L4.89542 6.67886C4.32956 7.35817 3.37157 7.44284 2.71105 6.87192L0.663455 5.10206C0.475648 4.93973 0.445198 4.64364 0.595444 4.44072C0.74569 4.23781 1.01974 4.20491 1.20754 4.36724L3.25514 6.1371C3.55537 6.39661 3.99082 6.35812 4.24803 6.04934L8.74082 0.655762C8.90171 0.46261 9.17707 0.446952 9.35584 0.620788Z" fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <span>전체 선택</span>
                </label>
            </div>
            <div>
                <button id="clearCheckBtn" class="delete-btn">선택된 품목 삭제</button>
                <button id="clearAllBtn" class="delete-btn">전체 품목 삭제</button>
            </div>
        </div>

        <div id="itemList" class="item-list">
        </div>

        <button id="exportBtn" class="export-btn">환산 사이트로 바로 추가하기</button>

        <div class="import-control"
            style="background: #f4fbf4; padding: 8px; border: 1px solid #d8ebd8; border-radius: 4px;">
            <select id="wishlistTargetFolderSelect">
                <option value="">-- 보관함 폴더 선택 --</option>
                <option value="NEW_FOLDER">🆕 [새 폴더 만들어 이동...]</option>
            </select>
            <button id="wishlistToFolderBtn">폴더에 보관하기</button>
        </div>
    </div>

    <!--보관함 목록-->
    <div id="storageContent" class="tab-content">
        <div class="import-box">
            <div class="import-btn-wrapper">
                <button id="myFromSiteBtn" class="import-btn-large">🔄 내 장비 불러오기</button>
                <button id="importFromSiteBtn" class="import-btn-large">🔄 보관함 불러오기</button>
            </div>
            <div id="importedListWrapper" class="imported-list-wrapper">
                <div
                    style="font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #333; display: flex; justify-content: space-between; align-items: center;">
                    <span>가져온 장비 선택</span>
                    <label style="font-weight: normal; cursor: pointer;"><input type="checkbox" id="selectAllImported"
                            checked> 전체 선택</label>
                </div>
                <div id="importedItems" class="imported-items">
                </div>
                <div class="import-control">
                    <select id="targetFolderSelect">
                        <option value="">-- 보관할 폴더 선택 --</option>
                        <option value="NEW_FOLDER">🆕 [새 폴더 만들어 이동...]</option>
                    </select>
                    <button id="submitImportBtn">이동 실행</button>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <input type="text" id="newFolderName" placeholder="새 폴더 이름 입력 (예: 본캐 섀도어)">
            <button id="createFolderBtn">폴더 추가</button>
        </div>

        <div id="folderList" class="folder-list">
        </div>
    </div>

    <div id="charNameModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <input type="text" id="modalInput" placeholder="캐릭터명 입력">
            <div class="modal-actions">
                <button id="modalCancelBtn" class="btn-cancel">취소</button>
                <button id="modalConfirmBtn" class="btn-confirm">확인</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
