<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body class="theme-modern">
    <div class="app-header">
        <h3>메이플 경매장 · 환산 브릿지 <span class="ver-pill">v2.0</span></h3>
        <button id="uiThemeToggleBtn" class="theme-toggle-btn" title="클릭하여 B안(모던 UI)과 A안(클래식 UI)을 즉시 전환합니다">모던 뷰</button>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" id="tabWishlist">경매장 찜 목록</button>
        <button class="tab-btn" id="tabStorage">환산 메이커 보관함</button>
        <button class="tab-btn" id="tabScouterSpecOrder">스펙업 순서</button>
    </div>

    <!--찜 목록-->
    <div id="wishlistContent" class="tab-content active">
        <div class="header-action">
            <div>
                <label style="display: flex; align-items: center; cursor: pointer; font-size: 13px;">
                    <input type="checkbox" id="selectAll" class="ui-checkbox">
                    <span class="ui-checkbox-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8" fill="none">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M9.35584 0.620788C9.53461 0.794625 9.5491 1.09213 9.38821 1.28528L4.89542 6.67886C4.32956 7.35817 3.37157 7.44284 2.71105 6.87192L0.663455 5.10206C0.475648 4.93973 0.445198 4.64364 0.595444 4.44072C0.74569 4.23781 1.01974 4.20491 1.20754 4.36724L3.25514 6.1371C3.55537 6.39661 3.99082 6.35812 4.24803 6.04934L8.74082 0.655762C8.90171 0.46261 9.17707 0.446952 9.35584 0.620788Z"
                                fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <span>전체 선택</span>
                </label>
            </div>
            <div style="display: flex; gap: 4px;">
                <button id="clearClosedBtn" class="delete-btn clear-closed-btn" title="판매종료(#판매종료) 또는 찜해제(#찜해제)된 매물을 찜 목록에서 일괄 삭제합니다">마감 정리</button>
                <button id="clearCheckBtn" class="delete-btn">선택 삭제</button>
                <button id="clearAllBtn" class="delete-btn">전체 삭제</button>
            </div>
        </div>

        <div class="filter-toolbar">
            <div class="filter-row">
                <div class="filter-group filter-group-char">
                    <span class="filter-label">캐릭터</span>
                    <select id="calcCharSelect" class="modern-select char-select">
                        <option value="">(환산 조회 캐릭 없음)</option>
                    </select>
                </div>
                <button id="toggleCraftConfigBtn" class="craft-cfg-toggle-btn" title="직작 원가 및 손익분기 기댓값 설정 열기/닫기">⚙️ 원가설정</button>
            </div>
            <div class="filter-row">
                <div class="filter-group filter-group-sort">
                    <span class="filter-label">정렬</span>
                    <select id="auctionSortSelect" class="modern-select sort-select">
                        <option value="default">찜한 순서</option>
                        <option value="fd_desc">최종뎀 높은 순</option>
                        <option value="eff_desc">가성비(10억당 FD) 순</option>
                        <option value="deal_desc">기댓값 대비 저가 순</option>
                        <option value="price_asc">가격 낮은 순</option>
                    </select>
                </div>
                <label class="filter-check-option" title="체크 시 판매종료(#판매종료) 및 찜해제(#찜해제)된 매물을 숨기고 판매 중인 매물만 표시합니다">
                    <input type="checkbox" id="chkOnlyOnSale" class="ui-checkbox">
                    <span class="ui-checkbox-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8" fill="none">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M9.35584 0.620788C9.53461 0.794625 9.5491 1.09213 9.38821 1.28528L4.89542 6.67886C4.32956 7.35817 3.37157 7.44284 2.71105 6.87192L0.663455 5.10206C0.475648 4.93973 0.445198 4.64364 0.595444 4.44072C0.74569 4.23781 1.01974 4.20491 1.20754 4.36724L3.25514 6.1371C3.55537 6.39661 3.99082 6.35812 4.24803 6.04934L8.74082 0.655762C8.90171 0.46261 9.17707 0.446952 9.35584 0.620788Z"
                                fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <span class="filter-check-text">판매중만 보기</span>
                </label>
            </div>
        </div>

        <div class="search-toolbar">
            <div class="search-input-wrap">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                    <path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd"/>
                </svg>
                <input type="text" id="wishlistSearchInput" class="wishlist-search-input" placeholder="아이템명, 부위(모자, 반지 등) 실시간 검색...">
                <button id="clearSearchBtn" class="search-clear-btn" style="display: none;" title="검색어 지우기">✕</button>
            </div>
        </div>

        <!-- 접이식 직작 원가 / 손익분기 설정 대시보드 -->
        <div id="craftConfigPanel" class="craft-config-panel" style="display: none;">
            <div class="craft-config-header">
                <span class="craft-config-title">직작 원가(손익분기) 기댓값 설정</span>
                <button id="resetCraftConfigBtn" class="craft-reset-btn">기본값 복원</button>
            </div>
            <div class="craft-event-row">
                <label class="craft-check-option" title="체크 시 샤이닝 스타포스(비용 30% 할인 + 21성 이하 파괴방지 구간 혜택) 기댓값을 적용합니다">
                    <input type="checkbox" id="chkShiningStarforce" class="ui-checkbox" checked>
                    <span class="ui-checkbox-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8" fill="none">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M9.35584 0.620788C9.53461 0.794625 9.5491 1.09213 9.38821 1.28528L4.89542 6.67886C4.32956 7.35817 3.37157 7.44284 2.71105 6.87192L0.663455 5.10206C0.475648 4.93973 0.445198 4.64364 0.595444 4.44072C0.74569 4.23781 1.01974 4.20491 1.20754 4.36724L3.25514 6.1371C3.55537 6.39661 3.99082 6.35812 4.24803 6.04934L8.74082 0.655762C8.90171 0.46261 9.17707 0.446952 9.35584 0.620788Z"
                                fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <span class="craft-check-text">샤타포스 적용</span>
                </label>
                <label class="craft-check-option" title="체크 시 미라클 타임(잠재능력 등업 확률 2배) 기댓값을 적용합니다">
                    <input type="checkbox" id="chkMiracleTime" class="ui-checkbox" checked>
                    <span class="ui-checkbox-box">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8" fill="none">
                            <path fill-rule="evenodd" clip-rule="evenodd"
                                d="M9.35584 0.620788C9.53461 0.794625 9.5491 1.09213 9.38821 1.28528L4.89542 6.67886C4.32956 7.35817 3.37157 7.44284 2.71105 6.87192L0.663455 5.10206C0.475648 4.93973 0.445198 4.64364 0.595444 4.44072C0.74569 4.23781 1.01974 4.20491 1.20754 4.36724L3.25514 6.1371C3.55537 6.39661 3.99082 6.35812 4.24803 6.04934L8.74082 0.655762C8.90171 0.46261 9.17707 0.446952 9.35584 0.620788Z"
                                fill="white" stroke="white" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                    <span class="craft-check-text">미라클 타임 적용</span>
                </label>
            </div>
            <div class="craft-grid">
                <div class="craft-field">
                    <label>에테(모/상/하) 노작</label>
                    <div class="craft-input-wrap"><input type="number" id="cfgEternalBase" value="7.0" step="0.5" min="0"><span>억</span></div>
                </div>
                <div class="craft-field">
                    <label>아케인 방어구 노작</label>
                    <div class="craft-input-wrap"><input type="number" id="cfgArcaneBase" value="0.5" step="0.1" min="0"><span>억</span></div>
                </div>
                <div class="craft-field">
                    <label>일반 칠흑 노작</label>
                    <div class="craft-input-wrap"><input type="number" id="cfgPitchedBase" value="12.0" step="1.0" min="0"><span>억</span></div>
                </div>
                <div class="craft-field">
                    <label>상위 칠흑(거공/고근)</label>
                    <div class="craft-input-wrap"><input type="number" id="cfgHighPitchedBase" value="25.0" step="1.0" min="0"><span>억</span></div>
                </div>
                <div class="craft-field">
                    <label>불운 리스크 할증</label>
                    <div class="craft-input-wrap"><input type="number" id="cfgRiskMult" value="1.0" step="0.05" min="0.5" max="2.0"><span>배</span></div>
                </div>
                <div class="craft-field">
                    <label>중고 가횟(5~7) 감가</label>
                    <div class="craft-input-wrap"><input type="number" id="cfgUsedCutDisc" value="15" step="5" min="0" max="60"><span>%</span></div>
                </div>
            </div>
            <div class="craft-tip">각 매물의 <b>🟢 기댓값 배지 [상세 보기]</b>를 클릭하면 스타포스·작·잠재 원가 내역을 확인하고 기댓값을 직접 지정할 수 있습니다.</div>
        </div>

        <div id="itemList" class="item-list">
        </div>

        <div style="display: flex; gap: 6px; margin-bottom: 8px;">
            <button id="exportBtn" class="export-btn" style="flex: 1; margin-bottom: 0;">아이템메이커로 추가</button>
            <button id="exportSimulBtn" class="export-btn export-simul-btn" style="flex: 1; margin-bottom: 0;">스펙업 순서(추가스펙)로 추가</button>
        </div>

        <div class="import-control"
            style="background: #fff9f2; padding: 8px; border: 1px solid #f3d9bd; border-radius: 6px;">
            <select id="wishlistTargetFolderSelect">
                <option value="">-- 보관함 폴더 선택 --</option>
                <option value="NEW_FOLDER">[+ 새 폴더 만들어 이동...]</option>
            </select>
            <button id="wishlistToFolderBtn">폴더에 보관하기</button>
        </div>
    </div>

    <!--보관함 목록-->
    <div id="storageContent" class="tab-content">
        <div class="import-box">
            <div class="import-btn-wrapper">
                <button id="myFromSiteBtn" class="import-btn-large">내 장비 불러오기</button>
                <button id="importFromSiteBtn" class="import-btn-large">보관함 불러오기</button>
            </div>
            <div id="importedListWrapper" class="imported-list-wrapper">
                <div
                    style="font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #333; display: flex; justify-content: space-between; align-items: center;">
                    <span>가져온 장비 선택</span>
                    <label style="font-weight: normal; cursor: pointer;"><input type="checkbox" id="selectAllImported"
                            checked> 전체 선택</label>
                </div>
                <div id="importedItems" class="imported-items">
                </div>
                <div class="import-control">
                    <select id="targetFolderSelect">
                        <option value="">-- 보관할 폴더 선택 --</option>
                        <option value="NEW_FOLDER">[+ 새 폴더 만들어 이동...]</option>
                    </select>
                    <button id="submitImportBtn">이동 실행</button>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <input type="text" id="newFolderName" placeholder="새 폴더 이름 입력 (예: 본캐 섀도어)">
            <button id="createFolderBtn">폴더 추가</button>
        </div>

        <div id="folderList" class="folder-list">
        </div>
    </div>

    <!--스펙업 순서-->
    <div id="scouterSpecOrderContent" class="tab-content">
        <div class="spec-config-card">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
                <div>
                    <label class="spec-field-label">목표 최종뎀</label>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="number" id="targetFdInput" value="30" step="0.1" class="spec-field-input">
                        <span style="font-size: 11px; color: #555; font-weight: bold;">%</span>
                    </div>
                    <div id="targetFdCurrent" style="font-size: 10px; color: #999; margin-top: 2px;">현재 적용 : 30 %</div>
                </div>

                <div>
                    <label class="spec-field-label">교환불가 가중치</label>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="number" id="untradeWeightInput" value="1.5" step="0.1" class="spec-field-input">
                        <span style="font-size: 11px; color: #555; font-weight: bold;">배</span>
                    </div>
                    <div id="untradeWeightCurrent" style="font-size: 10px; color: #999; margin-top: 2px;">현재 가중치 : 1.5 배
                    </div>
                </div>

                <div>
                    <label class="spec-field-label">조각 가격</label>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="number" id="fragmentPriceInput" value="700" step="10" class="spec-field-input">
                        <span style="font-size: 11px; color: #555; font-weight: bold;">만</span>
                    </div>
                    <div id="fragmentPriceCurrent" style="font-size: 10px; color: #999; margin-top: 2px;">현재 가격 : 700 만
                    </div>
                </div>

                <div>
                    <label class="spec-field-label">환불 가격</label>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <input type="number" id="flamePriceInput" value="300" step="10" class="spec-field-input">
                        <span style="font-size: 11px; color: #555; font-weight: bold;">만</span>
                    </div>
                    <div id="flamePriceCurrent" style="font-size: 10px; color: #999; margin-top: 2px;">현재 가격 : 300 만
                    </div>
                </div>
            </div>

            <button id="specOrderBtn" class="export-btn">설정 적용 및 분석 실행</button>
        </div>

        <div id="scouterResultContainer" style="max-height: 380px; overflow-y: auto; font-size: 12px;">
            <div style="text-align: center; color: #888; padding: 20px;">
                환산기 사이트에서 스펙업 순서를 조회한 뒤<br>[설정 적용 및 분석 실행] 버튼을 눌러주세요.
            </div>
        </div>
    </div>

    <div id="charNameModal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <input type="text" id="modalInput" placeholder="캐릭터명 입력">
            <div class="modal-actions">
                <button id="modalCancelBtn" class="btn-cancel">취소</button>
                <button id="modalConfirmBtn" class="btn-confirm">확인</button>
            </div>
        </div>
    </div>

    <script src="mapper.js"></script>
    <script src="fd_calculator.js"></script>
    <script src="popup_ui.js"></script>
    <script src="popup_aution.js"></script>
    <script src="popup_scouter.js"></script>

</body>

</html>
